<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREONY — 4H en moins par semaine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #060e3a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── CARD ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 860px;
      aspect-ratio: 860 / 380;
      background: linear-gradient(135deg, #0d2fd4 0%, #1040d8 40%, #0a25b8 100%);
      border-radius: 10px;
      overflow: hidden;
      padding: clamp(1.5rem, 4vw, 2.8rem) clamp(1.5rem, 4vw, 2.8rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── WAVES SVG ── */
    .waves {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ── TOP ROW ── */
    .top-row {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tagline {
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .logo {
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ── BODY ── */
    .body {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(0.8rem, 2vw, 1.4rem);
    }

    .headline {
      font-size: clamp(1.5rem, 5.2vw, 3.6rem);
      font-weight: 900;
      line-height: 1.05;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      max-width: 16ch;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(0.6rem, 1.5vw, 1.2rem);
      align-items: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: clamp(0.65rem, 1.1vw, 0.82rem);
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }

    .swatch {
      display: inline-block;
      width: clamp(0.7rem, 1.2vw, 0.95rem);
      height: clamp(0.7rem, 1.2vw, 0.95rem);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .swatch--red     { background: #ff3333; }
    .swatch--magenta { background: #ff33cc; }
    .swatch--lime    { background: #99ff00; }

    /* ── BADGE ── */
    .badge {
      position: absolute;
      bottom: clamp(1.2rem, 3vw, 2rem);
      right: clamp(1.2rem, 3vw, 2rem);
      z-index: 2;
      background: rgba(0, 0, 0, 0.30);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 4px;
      padding: 0.4rem 0.85rem;
      font-size: clamp(0.6rem, 1vw, 0.78rem);
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    @media (max-width: 560px) {
      .card { aspect-ratio: auto; min-height: 340px; }
      .badge { position: static; margin-top: 1rem; align-self: flex-end; }
      .tags  { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Background waves -->
    <svg class="waves" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- Main large arc -->
      <path d="M -80 320  Q 200 20  540 200  T 980 60"
            fill="none" stroke="#2448e8" stroke-width="90" opacity="0.55"/>
      <!-- Secondary arc offset -->
      <path d="M -60 420  Q 240 100  620 280  T 1020 120"
            fill="none" stroke="#1e3fd6" stroke-width="65" opacity="0.40"/>
      <!-- Top-right accent -->
      <path d="M 380 -60  Q 660 80  860 260"
            fill="none" stroke="#2040cc" stroke-width="44" opacity="0.30"/>
    </svg>

    <!-- Top row -->
    <div class="top-row">
      <span class="tagline">Discutons en !</span>
      <span class="logo">AREONY</span>
    </div>

    <!-- Centre -->
    <div class="body">
      <h1 class="headline">4H en moins<br>par semaine,<br>ça vous tente&nbsp;?</h1>
      <div class="tags">
        <span class="tag"><span class="swatch swatch--red"></span>Optimisation</span>
        <span class="tag"><span class="swatch swatch--magenta"></span>Automatisation</span>
        <span class="tag"><span class="swatch swatch--lime"></span>Productivité</span>
      </div>
    </div>

    <!-- Badge -->
    <div class="badge">+ de 10 clients accompagnés</div>

  </div>

</body>
</html>
