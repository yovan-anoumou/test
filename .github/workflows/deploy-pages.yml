name: Déployer CORTEX sur GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cortex-cognitive-training-app-n44e66
    paths:
      - "cortex/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cortex/package-lock.json

      - name: Installer les dépendances
        working-directory: cortex
        run: npm ci

      - name: Valider la banque de questions
        working-directory: cortex
        run: npm run validate:questions

      - name: Tests unitaires
        working-directory: cortex
        run: npm run test

      - name: Build (chemin GitHub Pages)
        working-directory: cortex
        env:
          DEPLOY_TARGET: gh-pages
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cortex/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
